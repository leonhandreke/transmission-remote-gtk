name: clang-format

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting-check:
    name: Formatting Check
    runs-on: ubuntu-latest
    env:
      # Pinned so that the result doesn't change with the runner image.
      # Use the same version locally: pip install clang-format==<version>
      CLANG_FORMAT_VERSION: 20.1.8
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "clang-format==$CLANG_FORMAT_VERSION"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Run clang-format style check
        run: |
          clang-format --version
          clang-format --dry-run --Werror src/*.c src/*.h

  blueprint-formatting-check:
    name: Blueprint Formatting Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install blueprint-compiler dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi
      - name: Get blueprint-compiler
        run: |
          # Use the same version as the meson wrap fallback
          revision=$(sed -n 's/^revision *= *//p' subprojects/blueprint-compiler.wrap)
          git clone --depth 1 --branch "$revision" \
            https://gitlab.gnome.org/GNOME/blueprint-compiler.git \
            "$RUNNER_TEMP/blueprint-compiler"
      - name: Run blueprint-compiler format check
        run: python3 "$RUNNER_TEMP/blueprint-compiler/blueprint-compiler.py" format src/*.blp
